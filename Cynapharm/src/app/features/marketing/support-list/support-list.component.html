<div class="support-list-container">
  <h1>Marketing Supports for {{ productName }}</h1>

  <div style="font-size: 11px; color: #666; margin-bottom: 10px;">
    loading={{ loading }} | error={{ error }} | supports.length={{ supports.length }}
  </div>

  <div class="action-bar">
    <a routerLink="/marketing/supports/new" [queryParams]="{ productId: productId }">
      <app-button label="Add Support" variant="primary"></app-button>
    </a>
    <button (click)="onBackToProduct()" style="margin-left: 10px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Back to Product
    </button>
  </div>

  <app-card title="Marketing Supports List">

    <div *ngIf="!loading">

      <div *ngIf="!loading && supports.length === 0" class="no-data">
        <p>No marketing supports found for this product.</p>
      </div>

      <div *ngIf="!loading && supports.length > 0" class="table-responsive">
        <table class="support-table">
          <thead>
            <tr>
              <th *ngFor="let col of columns">{{ col.label }}</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let support of supports">
              <td *ngFor="let col of columns">
                {{ getValue(support, col.key) }}
              </td>
              <td class="actions-cell">
                <button class="action-btn view-btn" (click)="onView(support)" title="View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
                <button class="action-btn edit-btn" (click)="onEdit(support)" title="Edit">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="action-btn delete-btn" (click)="onDelete(support)" title="Delete">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <div *ngIf="loading" class="loading">
      Loading supports...
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

  </app-card>
</div>
