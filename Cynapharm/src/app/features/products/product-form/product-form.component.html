<div class="product-form-container">
  <h1>{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h1>

  <app-card [title]="isEditMode ? 'Edit Product' : 'Add New Product'">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Product Name:</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name" 
          class="form-control"
          placeholder="Enter product name">
      </div>

      <div class="form-group">
        <label for="price">Price:</label>
        <input 
          type="number" 
          id="price" 
          formControlName="price" 
          class="form-control"
          placeholder="Enter price">
      </div>

      <div class="form-group">
        <label for="quantity">Quantity:</label>
        <input 
          type="number" 
          id="quantity" 
          formControlName="quantity" 
          class="form-control"
          placeholder="Enter quantity">
      </div>

      <div class="form-group">
        <label for="description">Description:</label>
        <textarea 
          id="description" 
          formControlName="description" 
          class="form-control"
          rows="4"
          placeholder="Enter product description"></textarea>
      </div>

      <div class="action-buttons">
        <a routerLink="/products">
          <app-button label="Cancel" variant="secondary"></app-button>
        </a>
        <app-button 
          [label]="isEditMode ? 'Update' : 'Create'" 
          variant="primary" 
          [disabled]="!productForm.valid || loading"
          (clicked)="onSubmit()"></app-button>
      </div>

      <div *ngIf="error" class="error">
        <p>{{ error }}</p>
      </div>

      <div *ngIf="success" class="success">
        <p>Product {{ isEditMode ? 'updated' : 'created' }} successfully!</p>
      </div>
    </form>
  </app-card>
</div>
