<!-- Forgot Password -->
<div class="forgot-password-container">
  <app-card title="Reset Password">
    
    <!-- ✅ Success: Email sent -->
    <div *ngIf="success" class="success-message">
      <p>{{ message }}</p>
      <p>Veuillez consulter votre boîte e-mail.</p>
      <div class="action-buttons">
        <app-button
          type="button"
          label="Retour à la connexion"
          variant="primary"
          (click)="goToLogin()">
        </app-button>
      </div>
    </div>

    <!-- ✅ Form: Request reset email -->
    <form *ngIf="!success" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Enter your email"
          required>
      </div>

      <div class="action-buttons">
        <app-button
          type="submit"
          label="Send Reset Link"
          variant="primary"
          [disabled]="forgotForm.invalid || loading">
        </app-button>
      </div>

      <div class="login-link">
        <p><a routerLink="/login">Back to login</a></p>
      </div>

      <div *ngIf="error" class="error">
        <p>{{ error }}</p>
      </div>

    </form>
  </app-card>
</div>
