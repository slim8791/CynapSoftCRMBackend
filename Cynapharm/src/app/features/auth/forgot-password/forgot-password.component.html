<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="rgba(0,180,216,0.18)"/>
          <g transform="rotate(-30 11 13)">
            <rect x="8" y="6" width="6" height="14" rx="3" fill="none" stroke="#00b4d8" stroke-width="2"/>
            <line x1="8" y1="13" x2="14" y2="13" stroke="#00b4d8" stroke-width="2"/>
          </g>
          <path d="M 23 21 C 23 11, 32 9, 32 9 C 32 17, 27 21, 23 21 Z" fill="#00b4d8"/>
          <rect x="12" y="21" width="16" height="4" rx="1" fill="#00b4d8"/>
          <path d="M 14 25 V 29 A 3 3 0 0 0 17 32 H 23 A 3 3 0 0 0 26 29 V 25" fill="none" stroke="#00b4d8" stroke-width="2"/>
        </svg>
      </div>
      <span class="logo-text">Cyna<strong>Pharm</strong></span>
    </div>

    <div class="form-header">
      <h2>Mot de passe oublié</h2>
      <p>Entrez votre adresse email pour recevoir un lien de réinitialisation sécurisé.</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="success" class="success-box">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h3>Email envoyé !</h3>
      <p>{{ message }}</p>
      <p>Veuillez consulter votre boîte de réception.</p>
      
      <button class="submit-btn outline-btn" (click)="goToLogin()">
        Retour à la connexion
      </button>
    </div>

    <!-- Form -->
    <form *ngIf="!success" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Adresse email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="field-input"
            placeholder="votre@email.com"
            autocomplete="email">
        </div>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="forgotForm.invalid || loading">
        <span *ngIf="!loading">Envoyer le lien</span>
        <span *ngIf="loading" class="btn-spinner"></span>
      </button>

      <div class="form-options">
        <a routerLink="/login" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Retour à la connexion
        </a>
      </div>

      <div *ngIf="error" class="error-alert">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
    </form>
  </div>
</div>
