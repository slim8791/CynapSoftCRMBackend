<!-- Reset Password -->
<div class="reset-password-container">
  <app-card title="New Password">
    
    <!-- ✅ Success -->
    <div *ngIf="success" class="success-message">
      <p>{{ message }}</p>
      <div class="action-buttons">
        <app-button
          type="button"
          label="Retour à la connexion"
          variant="primary"
          (click)="goToLogin()">
        </app-button>
      </div>
    </div>

    <!-- ✅ Form -->
    <form *ngIf="!success && email && token" [formGroup]="resetForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="newPassword">New Password:</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="form-control"
          placeholder="Enter new password"
          required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Confirm new password"
          required>
        <div *ngIf="resetForm.get('confirmPassword')?.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched" class="text-danger small mt-1">
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <div class="action-buttons">
        <app-button
          type="submit"
          label="Reset Password"
          variant="primary"
          [disabled]="resetForm.invalid || loading">
        </app-button>
      </div>

      <div class="login-link">
        <p><a routerLink="/login">Back to login</a></p>
      </div>

      <div *ngIf="error" class="error">
        <p>{{ error }}</p>
      </div>

    </form>

    <!-- ✅ Invalid link -->
    <div *ngIf="!email || !token" class="error">
      <p>Lien de réinitialisation invalide.</p>
      <div class="login-link">
        <p><a routerLink="/login">Back to login</a></p>
        <p><a routerLink="/forgot-password">Request new reset link</a></p>
      </div>
    </div>

  </app-card>
</div>
