<div class="register-container">
  <app-card title="Create a Cynapharm Account">

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

      <!-- ✅ Name -->
      <div class="form-group">
        <label>Name</label>
        <input class="form-control" formControlName="name" />
      </div>

      <!-- ✅ Email -->
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" formControlName="email" />
      </div>

      <!-- ✅ Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" formControlName="password" />
      </div>

      <!-- ✅ Adresse -->
      <div class="form-group">
        <label>Adresse</label>
        <input class="form-control" formControlName="adresse" />
      </div>

      <!-- ✅ Role -->
      <div class="form-group">
        <label>Role</label>
        <select class="form-control" formControlName="role">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>

      <!-- ✅ UserType (CLIENT uniquement) -->
      <div class="form-group" *ngIf="registerForm.value.role === 'CLIENT'">
        <label>User Type</label>
        <select class="form-control" formControlName="userType">
          <option *ngFor="let t of userTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- ✅ Pharmacien -->
      <div *ngIf="registerForm.value.userType === 'PHARMACIEN'">
        <input class="form-control" placeholder="Nom Officine" formControlName="nomOfficine" />
        <input class="form-control" placeholder="Type Pharmacie" formControlName="typePharmacie" />
      </div>

      <!-- ✅ Grossiste -->
      <div *ngIf="registerForm.value.userType === 'GROSSISTE'">
        <input class="form-control" placeholder="Raison Sociale" formControlName="raisonSociale" />
      </div>

      <app-button
  type="submit"
  label="Register"
  variant="primary"
  [disabled]="registerForm.invalid || loading">
</app-button>


      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="success" class="success">Utilisateur créé avec succès ✅</div>

    </form>

  </app-card>
</div>
