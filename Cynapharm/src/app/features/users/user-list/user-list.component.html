<div class="user-list-container">
  <h1>Users</h1>

  <div class="action-bar">
    <a routerLink="/users/new">
      <app-button label="Add User" variant="primary"></app-button>
    </a>
  </div>

  <app-card title="User List">

    <div *ngIf="!loading">

      <!-- ✅ Custom table with actions like products -->
      <div *ngIf="!loading && users.length === 0" class="no-data">
        <p>Aucun utilisateur trouvé.</p>
      </div>

      <!-- DEBUG users array -->
      <div *ngIf="!loading" class="debug-users">
        <strong>DEBUG: users.length = {{ users.length }}</strong>
        <pre *ngIf="users.length > 0" style="background:#e8f5e8; padding:10px; font-size:11px; max-height:150px;overflow:auto;">{{ users[0] | json }}</pre>
      </div>

      <div *ngIf="!loading && users.length > 0" class="table-responsive">
        <table class="user-table">
          <thead>
            <tr>
              <th *ngFor="let col of columns">{{ col.label }}</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td *ngFor="let col of columns">
{{ getValue(user, col.key) }}
              </td>
              <td class="actions-cell">
                <button class="action-btn view-btn" (click)="onView(user.id)" title="View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
                <button class="action-btn edit-btn" (click)="onEdit(user.id)" title="Edit">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="action-btn delete-btn" *ngIf="!user.isDeleted" (click)="onDelete(user)" title="Disable">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                  </svg>
                </button>
                <button class="action-btn enable-btn" *ngIf="user.isDeleted" (click)="onEnable(user)" title="Enable">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <div *ngIf="loading" class="loading">
      Loading users...
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

  </app-card>
</div>
