<div class="user-list-container">
  <h1>Users</h1>

  <div class="action-bar">
    <a routerLink="/users/new">
      <app-button label="Add User" variant="primary"></app-button>
    </a>
  </div>

  <app-card title="User List">

    <div *ngIf="!loading">

      <!-- ✅ Table alignée UserDto -->
      <app-table [columns]="columns" [data]="users"></app-table>

      <!-- ✅ Actions -->
      <div class="table-actions" *ngFor="let user of users">
        <a [routerLink]="['/users', user.id]">
          <app-button label="View" variant="secondary"></app-button>
        </a>

        <app-button
          label="Edit"
          variant="secondary"
          (clicked)="onEdit(user.id)">
        </app-button>

        <app-button
          *ngIf="!user.isDeleted"
          label="Disable"
          variant="danger"
          (clicked)="onDelete(user)">
        </app-button>

        <app-button
          *ngIf="user.isDeleted"
          label="Disabled"
          variant="secondary"
          [disabled]="true">
        </app-button>
      </div>

    </div>

    <div *ngIf="loading" class="loading">
      Loading users...
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

  </app-card>
</div>
