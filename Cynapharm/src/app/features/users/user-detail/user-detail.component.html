<div class="user-detail-container">
  <h1>User Details</h1>

  <!-- DEBUG INFO (optional - can be removed in production) -->
  <div style="font-size: 11px; color: #666; margin-bottom: 10px;">
    loading={{ loading }} | error={{ error }} | user={{ user ? 'present' : 'null' }}
  </div>

  <div *ngIf="loading && !user" class="loading">
    Loading user details...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && user" class="detail-card">
    <app-card [title]="user.Name || 'User'">
      
      <div class="detail-grid">
        <div class="detail-item">
          <label>ID:</label>
          <span>{{ user.Id }}</span>
        </div>

        <div class="detail-item">
          <label>Name:</label>
          <span>{{ user.Name }}</span>
        </div>

        <div class="detail-item">
          <label>Email:</label>
          <span>{{ user.Email }}</span>
        </div>

        <div class="detail-item">
          <label>Phone Number:</label>
          <span>{{ user.PhoneNumber || 'N/A' }}</span>
        </div>

        <div class="detail-item">
          <label>Adresse:</label>
          <span>{{ user.Adresse }}</span>
        </div>

        <div class="detail-item">
          <label>Role:</label>
          <span>{{ user.Role }}</span>
        </div>

        <div class="detail-item status-item">
          <label>Status:</label>
          <span [class]="(user.IsDeleted ? 'status-disabled' : 'status-active')">
            {{ user.IsDeleted ? 'Disabled' : 'Active' }}
          </span>
        </div>
      </div>

      <div class="action-buttons">
        <a routerLink="/users">
          <app-button label="Back to List" variant="secondary"></app-button>
        </a>
        <app-button label="Edit" variant="primary" (clicked)="onEdit()"></app-button>
        <app-button *ngIf="!user.IsDeleted" label="Disable" variant="danger" (clicked)="onDelete()"></app-button>
        <app-button *ngIf="user.IsDeleted" label="Enable" variant="success" (clicked)="onEnable()"></app-button>
      </div>

    </app-card>
  </div>
</div>
