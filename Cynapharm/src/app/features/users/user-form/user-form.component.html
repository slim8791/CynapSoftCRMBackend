<div class="user-form-container">
  <h1>{{ isEditMode ? 'Edit User' : 'Add User' }}</h1>

  <app-card [title]="isEditMode ? 'Edit User' : 'Add New User'">

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Name</label>
        <input class="form-control" formControlName="name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input class="form-control" formControlName="email" [readonly]="isEditMode">
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input class="form-control" formControlName="adresse">
      </div>

      <div class="form-group">
        <label>Role</label>
        <select class="form-control" formControlName="role">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>

      <!-- ✅ Création uniquement -->
      <div class="form-group" *ngIf="!isEditMode">
        <label>Password</label>
        <input type="password" class="form-control" formControlName="password">
      </div>

      <div class="action-buttons">
        <a routerLink="/users">
          <app-button label="Cancel" variant="secondary"></app-button>
        </a>

        <app-button
          [label]="isEditMode ? 'Update Role' : 'Create User'"
          variant="primary"
          [disabled]="userForm.invalid || loading">
        </app-button>
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="success" class="success">
        User {{ isEditMode ? 'updated' : 'created' }} successfully ✅
      </div>

    </form>

  </app-card>
</div>
