<div class="page">
      <div class="page-header">
        <a routerLink="/field/visites" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Retour
        </a>
        <h1>{{ isEdit ? 'Modifier la visite' : 'Nouvelle visite' }}</h1>
      </div>

      <div *ngIf="loadingData" class="loading-wrap">
        <div class="spinner"></div><span>Chargement...</span>
      </div>

      <div *ngIf="fetchError" class="error-banner">{{ fetchError }}</div>

      <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()" class="form-card" novalidate>
        <div class="form-grid">
          <div class="field">
            <label>Délégué (ID) *</label>
            <input type="number" formControlName="id_User_Delegue" placeholder="ID du délégué" />
            <span *ngIf="f['id_User_Delegue'].touched && f['id_User_Delegue'].invalid" class="field-error">Champ requis</span>
          </div>
          <div class="field">
            <label>Date *</label>
            <input type="date" formControlName="date" />
            <span *ngIf="f['date'].touched && f['date'].invalid" class="field-error">Champ requis</span>
          </div>
          <div class="field full">
            <label>Type de visite *</label>
            <select formControlName="type">
              <option value="">-- Sélectionner --</option>
              <option *ngFor="let t of typeOptions" [value]="t.value">{{ t.label }}</option>
            </select>
            <span *ngIf="f['type'].touched && f['type'].invalid" class="field-error">Champ requis</span>
          </div>
          <div class="field">
            <label>Médecin (ID) <span class="opt">optionnel</span></label>
            <input type="number" formControlName="id_Medecin" placeholder="ID médecin" />
          </div>
          <div class="field">
            <label>Pharmacien (ID) <span class="opt">optionnel</span></label>
            <input type="number" formControlName="id_Pharmacien" placeholder="ID pharmacien" />
          </div>
        </div>

        <div *ngIf="submitError" class="error-banner" style="margin-top:16px">{{ submitError }}</div>
        <div *ngIf="successMsg" class="success-banner">{{ successMsg }}</div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            <span *ngIf="saving" class="btn-spinner"></span>
            {{ saving ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer') }}
          </button>
          <a routerLink="/field/visites" class="btn btn-secondary">Annuler</a>
        </div>
      </form>
    </div>
